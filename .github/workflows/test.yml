name: Ollama CI probe

# Manual only: the first push does NOT run (the OLLAMA_API_KEY secret is not
# set yet). Trigger by hand once the secret is in place.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe Ollama cloud-direct (Bearer key, no daemon)
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_MODEL: glm-5.2:cloud
        run: python test_ollama.py