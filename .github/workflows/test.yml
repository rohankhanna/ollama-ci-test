name: Ollama CI probe

# push: forces GitHub to index the workflow on a brand-new repo AND runs the
# probe. workflow_dispatch: lets us re-run by hand. (The first push, before the
# secret was set, would have failed — the secret is now in place.)
on:
  push:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe Ollama cloud-direct (Bearer key, no daemon)
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_MODEL: glm-5.2:cloud
        run: python test_ollama.py